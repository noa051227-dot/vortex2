<script>
(function () {
  // ===== 現在ページの active（下線） =====
  const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

  const map = {
    'index.html': 'index',
    'firsttime.html': 'firsttime',
    'u12.html': 'u12',
    'u14.html': 'u14',
    'flow.html': 'flow',
    'vortex.html': 'vortex',
    'schedule.html': 'schedule',
    'contact.html': 'contact'
  };

  const key = map[path] || null;
  if (key) {
    document.querySelectorAll('[data-nav="' + key + '"]').forEach(a => a.classList.add('active'));
  }

  // ===== モバイル開閉：背景スクロール抑止 =====
  const toggle = document.getElementById('nav-toggle');
  if (toggle) {
    toggle.addEventListener('change', () => {
      document.body.classList.toggle('nav-open', toggle.checked);
    });
  }

  // ===== モバイル：初めての方へ サブメニュー開閉 =====
  const btn = document.querySelector('.firsttime-toggle');
  const sub = document.getElementById('mobile-firsttime-sub');

  if (btn && sub) {
    btn.addEventListener('click', () => {
      const isOpen = sub.classList.toggle('show');
      btn.classList.toggle('is-open', isOpen);
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ① ハンバーガー開閉と「×」表示（body.nav-open）を同期
  const navToggle = document.getElementById('nav-toggle');
  const syncNav = () => document.body.classList.toggle('nav-open', !!(navToggle && navToggle.checked));
  if (navToggle) {
    navToggle.addEventListener('change', syncNav);
    syncNav();
  }

  // ② モバイル：ドロップダウン（初めての方へ / VORTEXとは）をクリックで開閉
  document.querySelectorAll('.mobile-panel .mobile-row').forEach(row => {
    const btn = row.querySelector('button.firsttime-toggle');
    if (!btn) return;

    // mobile-row の直後にある .mobile-sub を開閉する想定
    const sub = row.nextElementSibling;
    if (!sub || !sub.classList.contains('mobile-sub')) return;

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      btn.classList.toggle('is-open');
      sub.classList.toggle('show');
    });
  });

  // ③ リンク押したらメニュー閉じる（任意だけど便利）
  document.querySelectorAll('.mobile-panel a').forEach(a => {
    a.addEventListener('click', () => {
      if (!navToggle) return;
      navToggle.checked = false;
      syncNav();
    });
  });
});
</script>
