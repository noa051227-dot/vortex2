<script>
(function () {
  const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

  const map = {
    'index.html': 'index',
    'firsttime.html': 'firsttime',
    'u12.html': 'u12',
    'u14.html': 'u14',
    'flow.html': 'flow',
    'vortex.html': 'vortex',
    'schedule.html': 'schedule',
    'contact.html': 'contact'
  };

  const key = map[path] || null;
  if (key) {
    document.querySelectorAll('[data-nav="' + key + '"]').forEach(a => a.classList.add('active'));
  }

  const toggle = document.getElementById('nav-toggle');
  if (toggle) {
    toggle.addEventListener('change', () => {
      document.body.classList.toggle('nav-open', toggle.checked);
    });
  }

  const btn = document.querySelector('.firsttime-toggle');
  const sub = document.getElementById('mobile-firsttime-sub');

  if (btn && sub) {
    btn.addEventListener('click', () => {
      const isOpen = sub.classList.toggle('show');
      btn.classList.toggle('is-open', isOpen);
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }
})();
</script>
